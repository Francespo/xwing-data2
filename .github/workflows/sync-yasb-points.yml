name: Sync YASB points

# Applies only the diff of the latest YASB points release to the XWA data.
# The unified pipeline then updates the submodule and points_history.
#
# Commit subjects are parsed by xwing-unified-data:
#   data: apply YASB 50P 2.2 points (2026-12-01)

permissions:
  contents: write

on:
  schedule:
    # 04:30 UTC, before xwing-unified-data's 05:00 sync.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Override points version (e.g. 2.2); empty = detect from YASB"
        required: false
        type: string
      date:
        description: "Override release date (YYYY-MM-DD); empty = detect from YASB"
        required: false
        type: string

concurrency:
  group: yasb-points-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply YASB release diff
        run: |
          ARGS="--meta /tmp/yasb_meta.json"
          if [ -n "${{ inputs.version }}" ]; then ARGS="$ARGS --version ${{ inputs.version }}"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python3 scripts/sync_yasb_points.py $ARGS

      - name: Commit and push the points release
        run: |
          if [ "$(jq -r .changed /tmp/yasb_meta.json)" != "true" ]; then
            echo "No YASB points changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pilots data/upgrades
          git commit -m "$(jq -r .message /tmp/yasb_meta.json)"
          git push origin HEAD:master
